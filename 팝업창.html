<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />


    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />

    <title>팝업창</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Pretendard", sans-serif;
        }

        body {
            width: 100%;
            height: 100vh;
            background: rgba(223, 221, 221, 0.75);

            display: flex;
            justify-content: center;
            align-items: center;

            transition: 0.3s;
        }


        .mode-btn {
            position: fixed;
            top: 20px;
            left: 20px;

            cursor: pointer;
            background: #303030;
            color: white;

            border: none;
            border-radius: 30px;

            padding: 10px 16px;
            font-size: 15px;
            font-weight: 500;

            transition: 0.3s;
        }

        .popup {
            width: 440px;
            height: 650px;

            background: white;
            border-radius: 12px;
            overflow: hidden;

            transition: 0.3s;
        }


        .popup-image {
            position: relative;
            width: 440px;
            height: 570px;
        }

        .popup-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }


        .popup-text {
            position: absolute;
            right: 28px;
            bottom: 36px;

            text-align: right;
            color: white;

            font-size: 30px;
            font-weight: 700;
            line-height: 1.3;
        }


        .popup-bottom {
            width: 100%;
            height: 80px;

            display: flex;
            border-top: 1px solid #e5e5e5;
        }

        .popup-btn {
            flex: 1;
            border: none;
            background: white;

            color: #333333;
            font-size: 16px;
            cursor: pointer;

            transition: 0.3s;
        }

        .popup-btn:first-child {
            border-right: 1px solid #e5e5e5;
        }

        .popup-btn:hover {
            background: #f5f5f5;
        }


        body.dark {
            background: #111;
        }

        body.dark .popup {
            background: #1f1f1f;
        }

        body.dark .popup-bottom {
            border-top: 1px solid #444;
        }

        body.dark .popup-btn {
            background: #1f1f1f;
            color: white;
        }

        body.dark .popup-btn:first-child {
            border-right: 1px solid #444;
        }

        body.dark .popup-btn:hover {
            background: #2c2c2c;
        }

        body.dark .mode-btn {
            background: white;
            color: #303030;
        }
    </style>
</head>

<body>
    <button class="mode-btn">🌜 Dark Mode</button>
    <div class="popup">

        <div class="popup-image">
            <img src="popup.jpg" alt="팝업 이미지">

            <div class="popup-text">

            </div>
        </div>

        <div class="popup-bottom">
            <button class="popup-btn">오늘 하루 안 보기</button>
            <button class="popup-btn">닫기</button>
        </div>

    </div>
    <script>
        const modeBtn = document.querySelector('.mode-btn');

        modeBtn.addEventListener('click', function () {

            document.body.classList.toggle('dark');

            if (document.body.classList.contains('dark')) {
                modeBtn.innerText = '🌞 Light Mode';
            } else {
                modeBtn.innerText = '🌜 Dark Mode';
            }

        });
    </script>

</body>

</html>
